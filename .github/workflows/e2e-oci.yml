name: E2E OCI Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-ghcr:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust target
        run: rustup target add wasm32-wasip2

      - name: Build Dummy Guest Component
        run: |
          cd examples/guests/telemetry-demo
          cargo build --target wasm32-wasip2 --release

      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          # Repository owner must be lowercase for OCI registries
          LOWER_OWNER=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${LOWER_OWNER}/wrdn-test-guest:latest"
          
          oras push $IMAGE \
            target/wasm32-wasip2/release/telemetry_demo.wasm:application/vnd.wasm.component.v1+wasm

      - name: Build wrdn CLI
        run: cargo build --release -p wrdn

      - name: Run wrdn install with OCI Ref
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          LOWER_OWNER=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${LOWER_OWNER}/wrdn-test-guest:latest"
          
          mkdir e2e-test-oci
          cd e2e-test-oci
          
          ../target/release/wrdn install $IMAGE

      - name: Verify OCI Installation
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          LOWER_OWNER=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
          PKG_NAME="${LOWER_OWNER}_wrdn-test-guest"
          
          cd e2e-test-oci
          
          if [ ! -d ".wrdn/$PKG_NAME" ]; then
            echo "Expected installation directory .wrdn/$PKG_NAME not found!"
            ls -la .wrdn || true
            exit 1
          fi
          
          echo "Verifying artifacts inside .wrdn/$PKG_NAME:"
          cd ".wrdn/$PKG_NAME"
          ls -la
          
          test -f guest.wasm || (echo "Missing guest.wasm" && exit 1)
          test -f virtualizer.wasm || (echo "Missing virtualizer.wasm" && exit 1)
          test -f warden_shim.js || (echo "Missing warden_shim.js" && exit 1)
          test -f policy.cedar || (echo "Missing policy.cedar" && exit 1)
          test -d out-guest || (echo "Missing transpiled out-guest dir" && exit 1)
          test -d out-warden || (echo "Missing transpiled out-warden dir" && exit 1)
          
          echo "All artifacts verified successfully!"
