name: E2E Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-integration:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add wasm32-wasip2

      - name: Run Linter
        run: make lint

      - name: Run Integration Tests
        run: ./tests/integration/run_tests.sh

  test-ghcr:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust target
        run: rustup target add wasm32-wasip2

      - name: Build Dummy Guest Component
        run: |
          cd tests/integration/scenarios/telemetry-exfiltration/guest
          cargo build --target wasm32-wasip2 --release

      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          # Repository owner must be lowercase for OCI registries
          LOWER_OWNER=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${LOWER_OWNER}/burr-test-guest:latest"
          
          oras push $IMAGE \
            target/wasm32-wasip2/release/telemetry_logger.wasm:application/vnd.wasm.component.v1+wasm

      - name: Build burr CLI
        run: cargo build --release -p burr

      - name: Run burr install with OCI Ref
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          LOWER_OWNER=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${LOWER_OWNER}/burr-test-guest:latest"
          
          mkdir e2e-test-oci
          cd e2e-test-oci
          
          ../target/release/burr install $IMAGE

      - name: Verify OCI Installation
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          LOWER_OWNER=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
          PKG_NAME="${LOWER_OWNER}_burr-test-guest"
          
          cd e2e-test-oci
          
          if [ ! -d ".burr/$PKG_NAME" ]; then
            echo "Expected installation directory .burr/$PKG_NAME not found!"
            ls -la .burr || true
            exit 1
          fi
          
          echo "Verifying artifacts inside .burr/$PKG_NAME:"
          cd ".burr/$PKG_NAME"
          ls -la
          
          test -f guest.wasm || (echo "Missing guest.wasm" && exit 1)
          test -f virtualizer.wasm || (echo "Missing virtualizer.wasm" && exit 1)
          test -f burr_shim.js || (echo "Missing burr_shim.js" && exit 1)
          test -d out-guest || (echo "Missing transpiled out-guest dir" && exit 1)
          test -d out-burr || (echo "Missing transpiled out-burr dir" && exit 1)
          
          cd ../..
          test -f burr.json || (echo "Missing burr.json" && exit 1)
          test -f policies/${PKG_NAME}_policy.cedar || (echo "Missing policy file" && exit 1)

          
          echo "All artifacts verified successfully!"
